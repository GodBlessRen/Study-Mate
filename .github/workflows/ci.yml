name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.runtime.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runtime: { node: '22.19.0', python: '3.9' } }
          - { os: ubuntu-latest, runtime: { node: '24', python: '3.13' } }
          - { os: macos-15-intel, runtime: { node: '22.19.0', python: '3.9' } }
          - { os: macos-latest, runtime: { node: '24', python: '3.13' } }
          - { os: windows-latest, runtime: { node: '22.19.0', python: '3.9' } }
          - { os: windows-latest, runtime: { node: '24', python: '3.13' } }
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.runtime.python }}
      - run: python -m pip install PyYAML
      - name: Windows PowerShell 5.1 installer smoke test
        if: runner.os == 'Windows' && matrix.runtime.node == '22.19.0'
        shell: powershell
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'studymate-ps51-home\.dsh'
          $env:LEARN_WORKSPACE = Join-Path $env:RUNNER_TEMP 'studymate-ps51-workspace'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer regression tests
        run: npm run test:installer
      - name: Python, DOM and release regression tests
        run: node scripts/release/checks.mjs

  dsh-runtime:
    name: ${{ matrix.os }} / DSH ${{ matrix.dsh }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, dsh: '0.1.5-rc.2' }
          - { os: ubuntu-latest, dsh: '0.1.6-alpha.2' }
          - { os: ubuntu-latest, dsh: '0.1.7-alpha.1' }
          - { os: ubuntu-latest, dsh: '0.1.7-alpha.2' }
          - { os: macos-latest, dsh: '0.1.5-rc.2' }
          - { os: macos-latest, dsh: '0.1.7-alpha.2' }
          - { os: windows-latest, dsh: '0.1.5-rc.2' }
          - { os: windows-latest, dsh: '0.1.7-alpha.2' }
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      STUDYMATE_DSH_EXPECTED_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Install isolated DSH runtime
        run: npm install --prefix "${{ runner.temp }}/studymate-dsh" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Install a downgrade target in a separate directory
        if: matrix.os == 'ubuntu-latest' && matrix.dsh == '0.1.7-alpha.2'
        run: |
          npm install --prefix "${{ runner.temp }}/studymate-dsh-older" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@deepseek-ai/dsh@0.1.5-rc.2"
          echo "STUDYMATE_DSH_DOWNGRADE_PACKAGE=${{ runner.temp }}/studymate-dsh-older/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"
      - name: Boot Web and verify learning preset in temporary homes
        env:
          STUDYMATE_DSH_PACKAGE: ${{ runner.temp }}/studymate-dsh/node_modules/@deepseek-ai/dsh
        run: npm run test:dsh
      - name: Install pnpm for plugin CLI regression tests
        run: npm install --global pnpm@10.12.3 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install, update and remove through the real DSH CLI
        env:
          STUDYMATE_DSH_PACKAGE: ${{ runner.temp }}/studymate-dsh/node_modules/@deepseek-ai/dsh
        run: npm run test:dsh-cli
